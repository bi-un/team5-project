<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>안심 QR 투표 시스템</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; border: none; color: white; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .btn-vote { background-color: #28a745; }
        .btn-vote:hover { background-color: #218838; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .candidate-item { margin: 15px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; text-align: left; cursor: pointer; display: flex; align-items: center; }
        .candidate-item:hover { background-color: #f1f1f1; }
        .candidate-item input { margin-right: 10px; width: auto; }
        .step-section { display: none; }
        .step-section.active { display: block; }
        #tokenDisplay { font-size: 11px; color: #888; margin-bottom: 15px; word-break: break-all; }
    </style>
    <!-- QRCode.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- [STEP 1] 정보 입력 및 QR 발급 화면 -->
        <div id="step1" class="step-section active">
            <h2>투표권 QR 발급</h2>
            <form id="registerForm">
                <input type="text" id="name" placeholder="성명 입력" required>
                <input type="password" id="idNumber" placeholder="주민등록번호 앞자리 등 (해시 처리용)" required>
                <select id="constituency" required>
                    <option value="">선거구 선택</option>
                    <option value="A">제1선거구</option>
                    <option value="B">제2선거구</option>
                </select>
                <button type="submit">QR 발급받기</button>
            </form>
            <div id="qrcode"></div>
            <button type="button" id="goToScanBtn" style="display:none; background-color: #6c757d; margin-top: 15px;">시뮬레이션: 스캔 단계로 넘어가기 ➔</button>
        </div>

        <!-- [STEP 2] QR 인증 화면 -->
        <div id="step2" class="step-section">
            <h2>투표소 QR 인증</h2>
            <div id="scanStatus" style="margin: 20px 0; font-weight: bold; color: #007bff;">토큰을 확인하는 중입니다...</div>
            <button type="button" id="goToBallotBtn" class="btn-vote" style="display:none;">투표용지로 이동하기</button>
            <button type="button" onclick="showStep(1)" style="background-color: #6c757d; margin-top: 10px;">처음으로 돌아가기</button>
        </div>

        <!-- [STEP 3] 투표용지 화면 -->
        <div id="step3" class="step-section">
            <h2>모바일 투표용지</h2>
            <div id="tokenDisplay">인증 토큰: -</div>
            <p style="color: #666; font-size: 13px; margin-bottom: 20px; text-align: center;">지지하는 후보를 선택 후 제출하세요.</p>
            
            <form id="voteForm">
                <div class="candidate-item">
                    <label style="width: 100%; cursor: pointer;"><input type="radio" name="candidate" value="1" required> 기호 1번 - 김철수 후보</label>
                </div>
                <div class="candidate-item">
                    <label style="width: 100%; cursor: pointer;"><input type="radio" name="candidate" value="2" required> 기호 2번 - 이영희 후보</label>
                </div>
                <div class="candidate-item">
                    <label style="width: 100%; cursor: pointer;"><input type="radio" name="candidate" value="3" required> 기호 3번 - 박민수 후보</label>
                </div>
                
                <button type="submit" class="btn-vote">투표 제출하기</button>
            </form>
        </div>
    </div>

    <script>
        let currentToken = "";

        // 화면 전환 함수
        function showStep(stepNumber) {
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`step${stepNumber}`).classList.add('active');
        }

        // [STEP 1] 발급 폼 제출
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const idNumber = document.getElementById('idNumber').value;
            const constituency = document.getElementById('constituency').value;

            // [백엔드 연동 부분]
            /*
            const response = await fetch('http://localhost:8080/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, idNumber, constituency })
            });
            const data = await response.json();
            currentToken = data.tokenUuid;
            */

            // 시뮬레이션용 더미 토큰 생성
            currentToken = "vote-token-" + Math.random().toString(36).substring(2, 9);

            // QR 코드 생성
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: currentToken,
                width: 160,
                height: 160
            });
            
            // 스캔 단계로 넘어갈 수 있는 버튼 노출
            document.getElementById('goToScanBtn').style.display = "block";
        });

        // 스캔 단계로 이동 버튼 클릭
        document.getElementById('goToScanBtn').addEventListener('click', function() {
            showStep(2);
            verifyAndProceed(currentToken);
        });

        // [STEP 2] 토큰 검증 시뮬레이션
        async function verifyAndProceed(token) {
            const statusDiv = document.getElementById('scanStatus');
            statusDiv.innerText = `토큰 검증 중... (${token})`;

            // [백엔드 연동 부분]
            /*
            const response = await fetch('http://localhost:8080/api/verify-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            });
            const isValid = await response.json();
            */

            setTimeout(() => {
                statusDiv.style.color = "#28a745";
                statusDiv.innerText = "✅ 인증 성공! 유효한 투표권입니다.";
                document.getElementById('goToBallotBtn').style.display = "block";
            }, 1000);
        }

        // 투표용지 이동 버튼 클릭
        document.getElementById('goToBallotBtn').addEventListener('click', function() {
            showStep(3);
            document.getElementById('tokenDisplay').innerText = `인증 토큰: ${currentToken}`;
        });

        // [STEP 3] 투표 제출
        document.getElementById('voteForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const selectedCandidate = document.querySelector('input[name="candidate"]:checked').value;

            // [백엔드 연동 부분]
            /*
            const response = await fetch('http://localhost:8080/api/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: currentToken, candidateId: selectedCandidate })
            });
            */

            alert(`✅ [투표 완료] 기호 ${selectedCandidate}번 후보에게 투표가 반영되었습니다!`);
            
            // 초기화 후 첫 화면으로 복귀
            document.getElementById('registerForm').reset();
            document.getElementById('qrcode').innerHTML = "";
            document.getElementById('goToScanBtn').style.display = "none";
            document.getElementById('goToBallotBtn').style.display = "none";
            document.getElementById('scanStatus').style.color = "#007bff";
            showStep(1);
        });
    </script>
</body>
</html>
