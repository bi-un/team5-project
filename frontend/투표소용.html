<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제N대 선거(XX시 ??구 제N투표소): QR 확인 화면</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        #reader { width: 320px; margin: 20px auto; }
        .fallback-container { margin-top: 15px; }
        #success-step {display: none; margin: 50px auto; padding: 40px 20px; 
            border: 3px solid #28a745; border-radius: 15px; max-width: 400px; 
            background-color: #e9f7ef;}
        #success-step h2 { color: #28a745; font-size: 28px; margin-bottom: 10px; }
        #voter-info { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .alert-text { color: #d9534f; font-weight: bold; font-size: 18px; margin-bottom: 30px; }
        .reset-btn { padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>제N투표소: QR로 본인확인</h2>

    <div id="scan-step">
        <p>QR 코드를 카메라에 스캔해주세요.</p>
        <div id="reader"></div>

        <div class="fallback-container">
            <p style="font-size: 13px; color: #888;">카메라 스캔이 안 될 경우:</p>
            <input type="text" id="manual-token" placeholder="난수 코드 입력">
            <button onclick="processToken(document.getElementById('manual-token').value)">입력</button>
        </div>
    </div>

    <div id="success-step">
        <h2>✅ 신원 확인 완료</h2>
        <p id="voter-info"></p>
        <p class="alert-text">안내원: 투표용지를 1장 교부해 주세요.</p>
        <button class="reset-btn" onclick="location.reload()">다음 유권자 대기(화면 초기화)</button>
    </div>

    <script>
        let html5QrcodeScanner;

        function onScanSuccess(decodedText, decodedResult) {
            console.log(`스캔 결과: ${decodedText}`);

            html5QrcodeScanner.clear(); //카메라 중단(안 하면 계속 스캔)
            
            processToken(decodedText);  //QR토큰 검증
        }

        // (수정됨) QR토큰을 백엔드로 보내서 진짜인지 검증
        async function processToken(token) {
            if (!token) {
                alert("유효한 코드를 입력해주세요.");
                return;
            }

            try {
                //스프링부트로 QR토큰 검증요청
                const response = await fetch('http://localhost:8080/api/vote/verify-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });

                //실패 시 에러 메시지
                if (!response.ok) {
                    const errorMsg = await response.text();
                    alert("인증 실패: " + errorMsg);
                    location.reload(); //다음 차례를 위한 새로고침
                    return;
                }

                //성공
                const data = await response.json();

                //스캔 화면은 숨기고, 성공 화면을 보여줌
                document.getElementById('scan-step').style.display = 'none';
                document.getElementById('success-step').style.display = 'block';
                //백엔드에서 넘겨준 선거구(constituency)를 화면에 출력
                document.getElementById('voter-info').innerText = `[${data.constituency}] 유권자입니다.`;

            } catch (error) {
                console.error("통신 에러:", error);
                alert("서버와 연결할 수 없습니다. 담당자에 문의 바랍니다.");
            }
        }

        window.onload = function() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                /* verbose= */ false
            );
            html5QrcodeScanner.render(onScanSuccess);
        };
    </script>
</body>
</html>
