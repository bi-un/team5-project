<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투표소 - QR 스캔 및 투표</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        #reader { width: 320px; margin: 20px auto; }
        .voting-paper { display: none; max-width: 400px; margin: 20px auto; border: 1px solid #ccc; padding: 20px; }
        .candidate-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; }
        .fallback-container { margin-top: 15px; }
    </style>
</head>
<body>

    <h2>투표소 - 본인 확인 및 투표</h2>

    <div id="scan-step">
        <p>유권자의 QR 코드를 카메라에 스캔해주세요.</p>
        <div id="reader"></div>

        <div class="fallback-container">
            <p style="font-size: 13px; color: #888;">카메라 스캔이 안 될 경우:</p>
            <input type="text" id="manual-token" placeholder="난수 코드 입력">
            <button onclick="processToken(document.getElementById('manual-token').value)">입력</button>
        </div>
    </div>

    <div id="vote-step" class="voting-paper">
        <h3>투표용지</h3>
        <p>선택할 후보자를 클릭하세요.</p>
        <button class="candidate-btn" onclick="submitVote(1)">기호 1번 : 후보자 A</button>
        <button class="candidate-btn" onclick="submitVote(2)">기호 2번 : 후보자 B</button>
    </div>

    <script>
        let html5QrcodeScanner;

        function onScanSuccess(decodedText, decodedResult) {
            console.log(`스캔 결과: ${decodedText}`);
            
            html5QrcodeScanner.clear();
            
            processToken(decodedText);
        }

        // (수정됨) QR 토큰을 백엔드로 보내서 진짜인지 검증하는 함수
        async function processToken(token) {
            if (!token) {
                alert("유효한 코드를 입력해주세요.");
                return;
            }

            try {
                // 백엔드(스프링 부트)로 QR 토큰 검증 요청 보내기
                const response = await fetch('http://localhost:8080/api/vote/verify-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });

                // 실패 시 에러 메시지 띄우기 (예: "가짜 QR입니다", "이미 사용 처리된 투표권입니다")
                if (!response.ok) {
                    const errorMsg = await response.text();
                    alert("인증 실패: " + errorMsg);
                    return;
                }

                // 성공 시 통과 메시지와 선거구 정보 받기
                const data = await response.json();
                alert(`${data.message}! (${data.constituency} 유권자)`);

                // 💡 중요: 다음 단계(투표 제출)에서 쓰기 위해 검증된 토큰과 선거구를 임시로 HTML에 저장해 둡니다.
                const voteStep = document.getElementById('vote-step');
                voteStep.dataset.token = token;
                voteStep.dataset.constituency = data.constituency;

                // 카메라 스캔 화면은 숨기고, 투표용지 화면을 보여줌
                document.getElementById('scan-step').style.display = 'none';
                voteStep.style.display = 'block';

            } catch (error) {
                console.error("통신 에러:", error);
                alert("서버와 연결할 수 없습니다. 백엔드 서버를 확인해주세요.");
            }
        }

        function submitVote(candidateId) {
            
            alert(`기호 ${candidateId}번에 투표 완료되었습니다.`);
            location.reload();
        }

        window.onload = function() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                /* verbose= */ false
            );
            html5QrcodeScanner.render(onScanSuccess);
        };
    </script>
</body>
</html>
